spring.application.name=accessmanager

# Puerto de la aplicación
server.port=${SERVER_PORT:8081}

# Base de datos: las credenciales se leen de variables de entorno.
# Nunca escribir la contraseña real en este archivo (el repo es público).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/accessmanager_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Configuración de Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# show-sql imprime cada consulta con datos de empleados en el log; activarlo solo para depurar
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuración de Zonas Horarias
spring.jackson.time-zone=UTC

# Seguridad
# Clave para firmar los JWT (mínimo 32 caracteres). Si falta, se genera una al azar en cada
# arranque y todas las sesiones se pierden al reiniciar.
jwt.secret=${JWT_SECRET:}
# Validez del token en minutos
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Orígenes permitidos para CORS, separados por coma (ej: https://app.fluxtech.com.ar)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Hardware: si es true, los relojes deben enviar ?token=<api_token de la empresa> en la URL.
# Dejarlo en false hasta configurar el token en todos los relojes, o dejarán de fichar.
hardware.require-token=${HARDWARE_REQUIRE_TOKEN:false}

# Conexión directa reloj → nube (/iclock/**, /api/hardware/**). Con el agente local funcionando,
# poner HARDWARE_DIRECTO_HABILITADO=false para que la nube acepte fichadas SOLO de agentes.
hardware.directo.habilitado=${HARDWARE_DIRECTO_HABILITADO:true}

# Agente local: cada cuántos segundos lee los relojes y reporta
agente.intervalo-segundos=${AGENTE_INTERVALO_SEGUNDOS:60}
