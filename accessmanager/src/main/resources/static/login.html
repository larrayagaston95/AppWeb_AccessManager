<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AccessManager - Login SaaS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <link href="./css/layout.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }
        .text-turquoise {
            color: #00d2ff !important;
        }
        .btn-turquoise {
            background-color: #00d2ff;
            color: #000;
            border: none;
            transition: all 0.3s;
        }
        .btn-turquoise:hover {
            background-color: #00b8e6;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
        }
        .form-control {
            background-color: #212529 !important;
            color: #ffffff !important;
            border-color: #495057 !important;
        }
        .form-control::placeholder {
            color: #94a3b8 !important;
        }
        .form-control:focus {
            background-color: #2a2a2a !important;
            color: #ffffff !important;
            border-color: #00d2ff !important;
            box-shadow: 0 0 0 0.25rem rgba(0, 210, 255, 0.25) !important;
        }
        /* Autofill contrast fix */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #212529 inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-turquoise mb-1">
                <i class="bi bi-shield-lock-fill me-2"></i>AccessManager
            </h2>
            <p class="text-white-50 small">Plataforma Cloud de Gestión de Accesos</p>
        </div>
        
        <form id="formLogin">
            <div class="mb-3">
                <label class="form-label text-light small fw-bold">USUARIO</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-person"></i></span>
                    <input type="text" id="inputUsername" class="form-control bg-dark text-white border-secondary" placeholder="ej. admin" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label text-light small fw-bold">CONTRASEÑA</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-key"></i></span>
                    <input type="password" id="inputPassword" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit" id="btnIngresar" class="btn btn-turquoise w-100 fw-bold py-2 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </button>
            
            <div id="loginError" class="alert alert-danger text-center small d-none p-2 m-0" role="alert">
                <i class="bi bi-exclamation-triangle me-1"></i> <span id="loginErrorMsg">Credenciales incorrectas.</span>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="module" src="./js/login.js"></script>
</body>
</html>
